# Nginx 站点配置:SPA 静态资源 + /api 反向代理到后端容器
# 后端地址通过 upsteam 环境变量注入不可行(nginx 不支持环境变量模板)。
# 必须用容器名 fawn-server 而非 compose 服务名 "server":生产环境中本容器
# 同时挂在 blog 项目的网络上,那边也有一个叫 "server" 的服务(blog-server),
# 服务名会被 Docker DNS 解析到对方导致 /api 打到别人后端 404;容器名全局唯一。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩文本资源
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源带指纹,可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反向代理:浏览器同源访问 /api,由 Nginx 转发到后端 8080
    location /api/ {
        proxy_pass http://fawn-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退:所有未命中路径返回 index.html,交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
