# ============================================================================
# 小鹿童装 Fawn Mall — 生产环境编排(腾讯云)
# 与 docker-compose.yml(本地开发,源码构建)的区别:
#   1. 前后端直接拉取腾讯云镜像仓库(TCR)镜像,不在服务器上构建;
#   2. MySQL 用腾讯云数据库 CDB(内网地址),不在编排内 —— DB_* 经 .env 注入;
#   3. Redis/RabbitMQ 端口只绑 127.0.0.1(运维经 SSH 隧道访问),公网 80/443 由
#      同机【已有的】blog-nginx 容器承载:web 加入 blog_default 外部网络,
#      nginx 按域名(mall.ljl0628.cn)用容器名 fawn-web 反代,本项目零新增公网端口;
#   4. 镜像地址与 tag 全部参数化:.env 中 REGISTRY/NAMESPACE/TAG。
#      个人版 REGISTRY=ccr.ccs.tencentyun.com;企业版为 <实例名>-tcr.tencentcloudcr.com;
#      CVM 与 TCR 同地域时走内网拉取(免公网流量费)。
#
# 多项目共存:compose project=fawn-mall,独立网络/数据卷/容器名前缀 fawn-;
# 与 blog 项目(/opt/blog)仅共享 blog_default 网络的 DNS 解析,互不影响。
# 80/443 的 mall 虚拟主机:在 /opt/blog/nginx/ 新增 mall.conf 并挂载(见 DEPLOY.md §3.4)。
#
# 服务器目录约定:/opt/fawn-mall(本文件 + .env)
# 用法:
#   cd /opt/fawn-mall
#   docker login $REGISTRY        # TCR 访问凭证(镜像私有,先登录)
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# 详细步骤见 DEPLOY.md。
# ============================================================================
name: fawn-mall

services:
  redis:
    image: redis:7-alpine
    container_name: fawn-redis
    restart: unless-stopped
    # 开启 AOF 持久化,重启后购物车/预扣库存不丢失
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - fawn-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: fawn-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fawn}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请在 .env 中设置 RABBITMQ_PASSWORD}
    ports:
      # 只发布管理控制台且仅本机可访(SSH 隧道:ssh -L 25672:127.0.0.1:25672 user@host);
      # AMQP 5672 不出容器网络(应用走 compose 内部服务名访问),减少端口占用
      - "127.0.0.1:${MQ_MGMT_PORT:-25672}:15672"
    volumes:
      - fawn-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # 后端:TCR 镜像,静态二进制,非 root 运行(见 server/Dockerfile)
  # MySQL 为腾讯云数据库(CDB),连接参数全部来自 .env 的 DB_*(内网直连,不经宿主端口)
  server:
    image: ${REGISTRY:?请在 .env 设置 REGISTRY(如 ccr.ccs.tencentyun.com)}/${NAMESPACE:?请在 .env 设置 NAMESPACE}/fawn-server:${TAG:-latest}
    container_name: fawn-server
    restart: unless-stopped
    environment:
      APP_ENV: prod # 强校验:jwt.secret>=32 字节、密码非空
      APP_SERVER_MODE: release
      APP_JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET(>=32 字节)}
      APP_DB_HOST: ${DB_HOST:?请在 .env 中设置 DB_HOST(腾讯云 MySQL 内网地址)}
      APP_DB_PORT: ${DB_PORT:-3306}
      APP_DB_USER: ${DB_USER:?请在 .env 中设置 DB_USER}
      APP_DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      APP_DB_NAME: ${DB_NAME:-fawn_mall}
      APP_REDIS_ADDR: redis:6379
      APP_RABBITMQ_URL: amqp://${RABBITMQ_USER:-fawn}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      APP_LOG_FORMAT: json # JSON 落文件(挂载持久化),stdout 安静
      # 七牛对象存储(可选):AK/SK 不配则图片上传接口返回业务错误,其余功能不受影响
      APP_QINIU_ACCESS_KEY: ${QINIU_AK:-}
      APP_QINIU_SECRET_KEY: ${QINIU_SK:-}
      APP_QINIU_BUCKET: ${QINIU_BUCKET:-}
      APP_QINIU_DOMAIN: ${QINIU_DOMAIN:-}
      APP_QINIU_REGION: ${QINIU_REGION:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-18080}:8080" # 健康检查/直连调试,公网不可达
    volumes:
      - fawn-server-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  # 前端:Nginx 托管 SPA 并反代 /api → server(见 web/nginx.conf)
  # 同时挂两个网络:default(容器内反代 server)+ blog-edge(blog-nginx 按域名接入)
  web:
    image: ${REGISTRY:?}/${NAMESPACE:?}/fawn-web:${TAG:-latest}
    container_name: fawn-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-18090}:80" # 仅本机调试用;公网流量走 blog-nginx → fawn-web:80
    networks:
      - default
      - blog-edge
    depends_on:
      - server

volumes:
  fawn-redis-data:
  fawn-rabbitmq-data:
  fawn-server-logs:

networks:
  # 复用 blog 项目的网络(blog compose project 名为 blog → 网络名 blog_default),
  # blog-nginx 借此用容器名 fawn-web 反代;external=true,本编排不创建也不删除它
  blog-edge:
    name: blog_default
    external: true
