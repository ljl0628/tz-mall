# 小鹿童装后端配置示例。
# 用法:cp config/config.example.yaml config/config.yaml 后按需修改;
# 真实 config.yaml / config.{env}.yaml 不入库(.gitignore)。
#
# 加载优先级(高 → 低):
#   APP_ 前缀环境变量 > config.{APP_ENV}.yaml > config.yaml > 内置默认值
# 环境变量映射:层级用下划线,如 db.password → APP_DB_PASSWORD、jwt.secret → APP_JWT_SECRET。
# 多环境:APP_ENV=dev/test/prod(默认 dev),非 dev 时叠加合并 config.{env}.yaml。

server:
  port: 8080
  mode: debug # debug | release(gin 运行模式)
  read_timeout: 10s
  write_timeout: 10s
  shutdown_timeout: 15s # SIGTERM 优雅关停预算:HTTP → MQ → DB 依次关闭

db:
  host: 127.0.0.1
  port: 3306
  user: fawn
  password: "" # 由 APP_DB_PASSWORD 注入,不写死;任何环境为空都会启动失败
  name: fawn_mall
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 1h

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

rabbitmq:
  url: amqp://fawn:fawn_dev_123@127.0.0.1:5672/
  reconnect_interval: 3s # 断线重连间隔
  op_timeout: 10s        # 发布确认 / 转入停车队列等操作超时

jwt:
  secret: "dev-only-secret-change-me-0123456789abcdef0123456789" # prod 由 APP_JWT_SECRET 注入且 >= 32 字节
  expire: 72h

log:
  level: info # debug/info/warn/error;支持热加载(仅此项,改配置文件即时生效)
  format: console # console(开发)| json(生产建议)
  dir: ./logs
  max_size_mb: 100 # 单文件超过该大小切割
  max_age_days: 14
  max_backups: 10
  compress: true

order:
  pay_timeout_seconds: 900 # 未支付自动取消时间(15 分钟,同时是延迟队列 TTL)
  max_retry: 3             # MQ 消费失败最大重试次数,超限进入停车队列
