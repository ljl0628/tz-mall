# 小鹿童装后端配置(开发默认值)
# 所有字段均可通过环境变量覆盖,规则:大写 + TZ_ 前缀,例如:
#   TZ_MYSQL_HOST / TZ_MYSQL_PORT / TZ_REDIS_ADDR / TZ_RABBITMQ_URL / TZ_JWT_SECRET ...
# 生产环境务必通过环境变量注入,禁止修改本文件提交真实密钥。

server:
  port: 8080
  mode: debug # debug | release

mysql:
  host: 127.0.0.1
  port: 3306
  user: fawn
  password: fawn_dev_123
  database: fawn_mall

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

rabbitmq:
  url: amqp://fawn:fawn_dev_123@127.0.0.1:5672/

jwt:
  secret: fawn-jwt-dev-secret-change-me
  expire_hours: 72

order:
  pay_timeout_seconds: 900 # 订单超时未支付自动取消时间(15 分钟)
  max_retry: 3             # MQ 消费基础设施类失败的最大重试次数

log:
  level: info # debug | info | warn | error
