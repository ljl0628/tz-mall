# CD:main 分支推送或 v* 标签时构建前后端镜像并推送 ghcr.io。
# 镜像 tag 规则(docker/metadata-action):
#   main 分支推送 → :main + :sha-xxxxxxx
#   v1.2.3 标签    → :1.2.3 + :1.2 + :latest
# 所有凭据来自 GitHub Secrets / GITHUB_TOKEN,仓库中不出现明文密钥。
name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    name: 构建并推送后端镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr 要求全小写镜像路径,仓库名可能含大写
      - name: 计算小写镜像名
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}/fawn-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: 构建并推送前端镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算小写镜像名
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}/fawn-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 可选部署 job:默认禁用(if: false)。
  # 启用方式:仓库 Settings → Secrets and variables → Actions 配置
  #   SSH_HOST:服务器地址  SSH_USER:登录用户  SSH_KEY:私钥全文
  # 然后把下方 `if: false` 删除即可。服务器上需预置 docker-compose.prod.yml。
  deploy:
    name: SSH 部署(可选,默认禁用)
    runs-on: ubuntu-latest
    needs: [build-server, build-web]
    if: false # 显式禁用,避免误发布
    environment: production
    steps:
      - name: 拉取最新镜像并重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /opt/fawn-mall
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
