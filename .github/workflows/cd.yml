# CD:main 分支推送或 v* 标签时,构建前后端镜像推送到【腾讯云镜像仓库 TCR】,
# 并可选自动 SSH 部署到腾讯云服务器。
#
# ── 需先在仓库 Settings → Secrets and variables → Actions 配置 ──
# Variables(非敏感):
#   TCR_REGISTRY   镜像仓库域名,如 ccr.ccs.tencentyun.com(个人版)
#                  或 <实例名>-tcr.tencentcloudcr.com(企业版)
#   TCR_NAMESPACE  TCR 内的命名空间(建议小写)
#   DEPLOY_ENABLED true 时启用自动部署(不配置则只构建推送)
# Secrets(敏感):
#   TCR_USERNAME / TCR_PASSWORD   TCR 访问凭证(企业版:控制台「访问凭证」
#                                  新建长期凭证;个人版注意临时密码时效)
#   SSH_HOST / SSH_USER / SSH_KEY 腾讯云服务器地址 / 登录用户 / 私钥全文
#
# 镜像 tag 规则(docker/metadata-action):
#   main 分支推送 → :main + :sha-xxxxxxx
#   v1.2.3 标签    → :1.2.3 + :1.2 + :latest
# 服务器 /opt/fawn-mall/.env 里 TAG=main 自动跟随主干,TAG=v1.2.3 / sha-xxx 固定版本。
name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  build-server:
    name: 构建并推送后端镜像 → TCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}/fawn-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: 构建并推送前端镜像 → TCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}/fawn-web
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 自动部署:构建推送成功后 SSH 到腾讯云服务器拉取并重启。
  # 开关:仓库 Variable DEPLOY_ENABLED=true;可在 Settings → Environments →
  # production 配置 Required reviewers 增加人工确认。
  deploy:
    name: SSH 自动部署到腾讯云(按 DEPLOY_ENABLED 开关)
    runs-on: ubuntu-latest
    needs: [build-server, build-web]
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: 登录 TCR 并拉取最新镜像重启
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/fawn-mall
            echo '${{ secrets.TCR_PASSWORD }}' | docker login ${{ vars.TCR_REGISTRY }} -u '${{ secrets.TCR_USERNAME }}' --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
