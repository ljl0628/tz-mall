# CI:后端(真实 MySQL/Redis/RabbitMQ 服务容器,禁止 mock)+ 前端类型检查与构建。
# 任一 job 失败即整个 CI 失败,阻止合入。
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端(vet / gofmt / build / test)
    runs-on: ubuntu-latest

    # 真实中间件服务容器:与 docker-compose 同版本,绝不用 mock 替代
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fawn_root_ci
          MYSQL_USER: fawn
          MYSQL_PASSWORD: fawn_ci_pw
          MYSQL_DATABASE: fawn_mall
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pfawn_root_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13
        env:
          RABBITMQ_DEFAULT_USER: fawn
          RABBITMQ_DEFAULT_PASS: fawn_ci_pw
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI 服务监听 localhost 标准端口,与本地开发(3316/6381/5673)不同,统一覆盖
      TZ_MYSQL_HOST: 127.0.0.1
      TZ_MYSQL_PORT: '3306'
      TZ_MYSQL_USER: fawn
      TZ_MYSQL_PASSWORD: fawn_ci_pw
      TZ_MYSQL_DATABASE: fawn_mall_test # 测试库与开发库隔离;root 自动创建
      TZ_MYSQL_ROOT_PASSWORD: fawn_root_ci
      TZ_REDIS_ADDR: 127.0.0.1:6379
      TZ_RABBITMQ_URL: amqp://fawn:fawn_ci_pw@127.0.0.1:5672/

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: server/go.sum

      # 等待服务容器就绪(GitHub healthcheck 已保证,这里兜底确认 RabbitMQ 端口可连)
      - name: 等待中间件就绪
        run: |
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/127.0.0.1/5672) 2>/dev/null && { echo "rabbitmq up"; exit 0; }
            sleep 2
          done
          echo "rabbitmq 未就绪"; exit 1

      - name: gofmt 检查
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "请运行 gofmt -w ."; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -p 1 串行执行:测试共享同一套 MySQL/Redis,避免并发互踩
      - name: go test(真实 MySQL/Redis/RabbitMQ)
        run: go test -p 1 -count=1 -v ./...

  frontend:
    name: 前端(typecheck / build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: vue-tsc 类型检查
        run: npx vue-tsc --noEmit

      - name: 生产构建
        run: npm run build
